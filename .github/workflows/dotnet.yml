name: .NET

on:
  push:
    branches: [main]
    paths: ['dotnet/**', '.github/workflows/dotnet.yml']
    tags: ['v*']
  pull_request:
    paths: ['dotnet/**', '.github/workflows/dotnet.yml']

permissions:
  contents: read

defaults:
  run:
    working-directory: dotnet

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      # Os testes rodam em net8.0, net9.0 e net10.0; a biblioteca é compilada para net8.0.
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x

      - run: dotnet restore
      - run: dotnet build --no-restore -c Release
      - run: dotnet test --no-build -c Release
        env:
          ILEVA_TEST_REDIS_HOST: 127.0.0.1
          ILEVA_TEST_REDIS_PORT: 6379

  # Uma tag vX.Y.Z publica no NuGet com a mesma versão. Sem chave de API guardada: o NuGet confia
  # neste repositório e neste workflow (Trusted Publishing, política "ileva-sdk-api-v3-auth" em
  # nuget.org) e o login troca a identidade do GitHub por uma chave que vale poucos minutos.
  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - run: dotnet pack src/Ileva.SdkApiV3.Auth -c Release -p:Version="${GITHUB_REF_NAME#v}" -o out

      # "user" é o nome do perfil no nuget.org, não o e-mail.
      - uses: NuGet/login@v1
        id: login
        with:
          user: ileva

      - run: dotnet nuget push "out/*.nupkg" --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
