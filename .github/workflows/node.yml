name: Node

on:
  push:
    branches: [main]
    paths: ['node/**', '.github/workflows/node.yml']
    tags: ['v*']
  pull_request:
    paths: ['node/**', '.github/workflows/node.yml']

permissions:
  contents: read

defaults:
  run:
    working-directory: node

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['20', '22', '24']

    services:
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - run: npm install --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test
        env:
          ILEVA_TEST_REDIS_HOST: 127.0.0.1
          ILEVA_TEST_REDIS_PORT: 6379
      - run: npm run build

  # Uma tag vX.Y.Z publica no npm com a mesma versão. O PHP é publicado pelo Packagist, que lê a tag.
  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - run: npm install --no-audit --no-fund
      - run: npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version
      - run: npm run build
      - run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
