name: Python

on:
  push:
    branches: [main]
    paths: ['python/**', '.github/workflows/python.yml']
    tags: ['v*']
  pull_request:
    paths: ['python/**', '.github/workflows/python.yml']

permissions:
  contents: read

defaults:
  run:
    working-directory: python

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.11', '3.12', '3.13', '3.14']

    services:
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - run: pip install -e ".[test]"
      - run: pytest
        env:
          ILEVA_TEST_REDIS_HOST: 127.0.0.1
          ILEVA_TEST_REDIS_PORT: 6379

  # Uma tag vX.Y.Z publica no PyPI com a mesma versão, por trusted publishing (sem token): o projeto
  # precisa estar configurado no PyPI para confiar neste repositório e neste workflow.
  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Versão da tag e licença da raiz
        run: |
          sed -i "s/^__version__ = .*/__version__ = \"${GITHUB_REF_NAME#v}\"/" src/ileva_sdk_api_v3_auth/__init__.py
          cp ../LICENSE LICENSE

      - run: pip install build && python -m build

      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: python/dist/
