name: PHP

on:
  push:
    branches: [main]
    paths: ['php/**', 'composer.json', '.github/workflows/php.yml']
  pull_request:
    paths: ['php/**', 'composer.json', '.github/workflows/php.yml']

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.2', '8.3', '8.4']

    services:
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: curl, json, redis
          coverage: none
          # Os testes de vazamento de senha só fazem sentido com os argumentos no trace.
          ini-values: zend.exception_ignore_args=0

      - run: composer install --no-interaction --no-progress

      - run: composer test
        env:
          ILEVA_TEST_REDIS_HOST: 127.0.0.1
          ILEVA_TEST_REDIS_PORT: 6379
