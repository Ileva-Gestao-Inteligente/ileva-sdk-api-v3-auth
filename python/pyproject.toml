[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "ileva-sdk-api-v3-auth"
dynamic = ["version"]
description = "Autenticação na API Ileva v3: gera o token de acesso e mantém sua validade, com cache compartilhado em Redis."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
keywords = ["ileva", "oauth", "token", "redis", "sdk"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Operating System :: OS Independent",
    "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
redis = ["redis>=4.2"]
requests = ["requests>=2.28"]
httpx = ["httpx>=0.24"]
test = ["pytest>=8", "redis>=4.2", "requests>=2.28", "httpx>=0.24"]

[tool.hatch.version]
path = "src/ileva_sdk_api_v3_auth/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/ileva_sdk_api_v3_auth"]

[tool.pytest.ini_options]
testpaths = ["tests"]
